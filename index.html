<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Client Rate</title>
<style>
body{margin:0;background:#eef3f8;font-family:Arial,sans-serif}
.container{max-width:420px;margin:40px auto;padding:15px}
.header{background:linear-gradient(135deg,#1976d2,#42a5f5);color:#fff;padding:18px;border-radius:16px;text-align:center}
.card{background:#fff;margin-top:18px;padding:18px;border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.row{display:flex;justify-content:space-between;padding:18px 0;border-bottom:1px solid #eee}
.row:last-child{border:none}.label{font-size:20px;font-weight:bold}.value{font-size:30px;font-weight:bold;color:#1976d2}
button{width:100%;padding:14px;border:none;border-radius:12px;background:#1976d2;color:#fff;font-size:18px;cursor:pointer}
.status{display:none;margin-top:14px;padding:12px;background:#d4edda;color:#155724;border-radius:10px;text-align:center}
</style></head>
<body>
<div class="container">
<div class="header">
<h2 id="date"></h2>
<div id="group" style="display:none"></div>
</div>
<div class="card">
<div class="row"><div class="label">💵 Cash</div><div class="value" id="cash">...</div></div>
<div class="row"><div class="label">🏦 Wire</div><div class="value" id="wire">...</div></div>
<button id="refreshBtn">🔄 Refresh Rate</button>
<div id="status" class="status">
<div><b>✅ Rates are updated live.</b></div>
<div id="refreshTime" style="margin-top:6px"></div>
</div>
<div style="margin-top:18px;padding:12px;background:#fff8e1;border-left:4px solid #ff9800;border-radius:8px;font-size:14px;line-height:1.5;color:#555;">
<b>Note:</b><ul style="margin:8px 0 0 18px;padding:0;"><li>Offers above <b>30,000</b> are welcome. We will review the daily flow and decide.</li><li>This is our buying rate.</li></ul></li><li>Prices are subject to availability. Please confirm stock availability with us before locking in the price.</li></ul>
</div>
</div></div>
<script>
const API="https://script.google.com/macros/s/AKfycbyREkJCozAVTz7Q-IcbVHtkJm8XyO5HFcKtni5VQg3A-CFmqeP35LThMnicpgyYylgY/exec";
const key=new URLSearchParams(location.search).get("key");
const hkDate = new Date().toLocaleDateString("en-GB",{
    timeZone:"Asia/Hong_Kong",
    day:"2-digit",
    month:"short",
    year:"numeric"
});
document.getElementById("date").textContent = "📅 " + hkDate;
async function loadRate(show){
 const btn=document.getElementById("refreshBtn");
 btn.disabled=true;btn.textContent="⏳ Refreshing...";
 try{
  const r=await fetch(API+"?key="+encodeURIComponent(key));
  const d=await r.json();

  if(d.status==="error"){
    document.getElementById("cash").textContent="Invalid";
    document.getElementById("wire").textContent="Invalid";
    return;
  }

  document.getElementById("group").textContent=d.group;
  document.getElementById("cash").textContent=d.cash;
  document.getElementById("wire").textContent=d.wire;
  if(show){
    const t=new Date().toLocaleTimeString("en-GB",{timeZone:"Asia/Hong_Kong",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
    document.getElementById("refreshTime").textContent="🇭🇰 "+t+" HKT";
    const s=document.getElementById("status");
    s.style.display="block";
    clearTimeout(window.hideTimer);
    window.hideTimer=setTimeout(()=>{s.style.display="none";},20000);
  }
 }catch(e){
  document.getElementById("cash").textContent="Error";
  document.getElementById("wire").textContent="Error";
 }finally{
  btn.disabled=false;btn.textContent="🔄 Refresh Rate";
 }
}
document.getElementById("refreshBtn").addEventListener("click",()=>loadRate(true));
loadRate(false);
</script></body></html>
